services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: dobryshkaf
      POSTGRES_USER: dobryshkaf
      POSTGRES_PASSWORD: dobryshkaf
    ports:
      - '127.0.0.1::5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - '127.0.0.1:1025:1025'
      - '127.0.0.1:8025:8025'

volumes:
  postgres-data:
