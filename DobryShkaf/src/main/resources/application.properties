spring.application.name=DobryShkaf

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/dobryshkaf}
spring.datasource.username=${DB_USERNAME:dobryshkaf}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

app.public-url=${APP_PUBLIC_URL:http://localhost:8080}
app.mail-from=${APP_MAIL_FROM:noreply@dobryshkaf.local}
app.confirmation-token-ttl=24h
